<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경북여상 방과후학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --ink:#2a2140; --sub:#6f6787; --line:#e4def0; --bg:#f7f4fb; --card:#fff;
          --main:#6a4bc4; --main-d:#4c3399; --pink:#ff6f91; --peach:#ffb199;
          --ok:#1f7a4d; --warn:#b3541e; --bad:#c0303f; --soft:#f0eafc;
          --grad:linear-gradient(120deg,#5a3fc0 0%,#9a4fc7 48%,#ff6f91 100%); }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
         color:var(--ink); background:var(--bg); font-size:15px; line-height:1.55; }
  .disp { font-family:"Jua","Pretendard","Malgun Gothic",sans-serif; font-weight:400; }

  /* ---- 첫 화면 ---- */
  .stage { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
           position:relative; overflow:hidden; color:#fff;
           background:linear-gradient(135deg,#4a34b0 0%,#8a48c4 42%,#f0679a 78%,#ffb08a 100%);
           background-size:180% 180%; animation:drift 16s ease-in-out infinite alternate; }
  @keyframes drift { from { background-position:0% 30%; } to { background-position:100% 70%; } }
  .orb { position:absolute; border-radius:50%; filter:blur(2px); opacity:.35; pointer-events:none;
         background:radial-gradient(circle at 30% 30%,#fff,rgba(255,255,255,0) 70%); animation:float 9s ease-in-out infinite; }
  .orb.o1 { width:340px; height:340px; left:-90px; top:-70px; }
  .orb.o2 { width:240px; height:240px; right:-50px; top:18%; animation-delay:-3s; }
  .orb.o3 { width:420px; height:420px; right:8%; bottom:-190px; animation-delay:-6s; opacity:.25; }
  .orb.o4 { width:150px; height:150px; left:12%; bottom:10%; animation-delay:-4.5s; }
  @keyframes float { 0%,100% { transform:translateY(0) scale(1); } 50% { transform:translateY(-26px) scale(1.05); } }
  .intro { cursor:pointer; text-align:center; user-select:none; }
  .intro .in { position:relative; z-index:1; max-width:1000px; }
  .intro .hello { font-size:clamp(17px,2.6vw,26px); opacity:0; animation:rise .9s .2s ease-out forwards; letter-spacing:.02em; }
  .intro .school { display:inline-block; margin-top:18px; padding:5px 16px; border:1px solid rgba(255,255,255,.6);
           border-radius:30px; font-size:clamp(13px,1.6vw,16px); letter-spacing:.18em; opacity:0; animation:rise .9s .7s ease-out forwards; }
  .intro h1 { margin:18px 0 10px; font-size:clamp(44px,10.5vw,128px); line-height:1.12; text-shadow:0 8px 30px rgba(40,10,80,.35); }
  .intro h1 .w { display:inline-block; white-space:nowrap; margin:0 .12em; }
  .intro h1 .ch { display:inline-block; opacity:0; transform:translateY(.6em) rotate(8deg) scale(.6);
           animation:pop .75s cubic-bezier(.2,1.5,.4,1) forwards, sway 3.2s ease-in-out infinite; }
  @keyframes pop { to { opacity:1; transform:none; } }
  @keyframes sway { 0%,100% { translate:0 0; } 50% { translate:0 -7px; } }
  @keyframes rise { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
  .intro .tag2 { font-size:clamp(15px,2.2vw,22px); opacity:0; animation:rise .9s 2.1s ease-out forwards; }
  .intro .go { margin-top:44px; display:inline-block; padding:13px 34px; border-radius:40px; background:#fff; color:var(--main-d);
           font-weight:700; font-size:17px; box-shadow:0 10px 30px rgba(40,10,80,.3); opacity:0;
           animation:rise .9s 2.6s ease-out forwards, pulse 2s 3.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.06); } }

  /* ---- 로그인 ---- */
  .login { position:relative; z-index:1; width:100%; max-width:420px; background:rgba(255,255,255,.96); color:var(--ink);
           border-radius:22px; padding:30px 28px 26px; box-shadow:0 24px 60px rgba(40,10,80,.35); animation:rise .6s ease-out; }
  .login .mark { width:58px; height:58px; border-radius:18px; background:var(--grad); color:#fff; display:flex;
           align-items:center; justify-content:center; font-size:30px; margin:0 auto 12px; box-shadow:0 8px 18px rgba(106,75,196,.4); }
  .login h2 { text-align:center; font-size:26px; margin:0; color:var(--main-d); }
  .login .lead { text-align:center; color:var(--sub); margin:4px 0 18px; font-size:14px; }
  .login input, .login select { width:100%; padding:11px 12px; border-radius:11px; }
  .login button.pri { width:100%; padding:12px; border-radius:12px; font-size:16px; font-weight:700; margin-top:6px; }
  .login .row > div { flex:1 1 70px; }
  .login .back { display:block; margin:14px auto 0; border:0; background:none; color:var(--sub); font-size:13px; }
  .seg { display:flex; margin-bottom:8px; background:var(--soft); border-radius:12px; padding:4px; }
  .seg button { flex:1; border:0; background:transparent; border-radius:9px; padding:9px; font-weight:600; color:var(--sub); }
  .seg button.on { background:#fff; color:var(--main-d); box-shadow:0 2px 8px rgba(76,51,153,.18); }

  /* ---- 공통 ---- */
  header.top { background:var(--grad); color:#fff; padding:12px 18px; display:flex; flex-wrap:wrap;
               gap:8px; align-items:center; justify-content:space-between; box-shadow:0 4px 16px rgba(76,51,153,.25); }
  header.top h1 { font-size:21px; margin:0; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
  header.top h1 small { font-family:"Pretendard",sans-serif; font-size:14px; font-weight:500; opacity:.92; }
  header.top .who { font-size:14px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  main { max-width:1080px; margin:0 auto; padding:18px 16px 40px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:14px;
          box-shadow:0 3px 14px rgba(76,51,153,.06); }
  h2 { font-size:18px; margin:0 0 10px; }
  h3 { font-size:15px; margin:18px 0 8px; color:var(--main-d); }
  .sub { color:var(--sub); font-size:13px; }
  button, .btn { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink);
           border-radius:9px; padding:6px 12px; cursor:pointer; transition:.15s; }
  button:hover { border-color:var(--main); }
  button.pri { background:var(--main); border-color:var(--main); color:#fff; }
  button.pri:hover { background:var(--main-d); }
  button.danger { color:var(--bad); }
  button.small { padding:3px 9px; font-size:13px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  header.top button { background:rgba(255,255,255,.16); color:#fff; border-color:rgba(255,255,255,.5); }
  header.top button:hover { background:rgba(255,255,255,.28); border-color:#fff; }
  input, select, textarea { font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:9px;
           background:#fff; color:var(--ink); max-width:100%; }
  input:focus, select:focus, textarea:focus { outline:2px solid rgba(106,75,196,.35); border-color:var(--main); }
  textarea { width:100%; min-height:130px; font-family:ui-monospace,Consolas,monospace; font-size:13px; }
  label { display:block; font-size:13px; color:var(--sub); margin:10px 0 3px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .row > div { flex:1 1 120px; }
  .row input, .row select { width:100%; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .tabs button { border-radius:20px; padding:7px 16px; }
  .tabs button.on { background:var(--main); color:#fff; border-color:var(--main); }
  table { border-collapse:collapse; width:100%; }
  th, td { border-bottom:1px solid var(--line); padding:7px 8px; text-align:left; vertical-align:middle; }
  th { font-size:13px; color:var(--sub); font-weight:600; background:#faf8fe; white-space:nowrap; }
  .scroll { overflow-x:auto; }
  .tag { display:inline-block; font-size:12px; padding:1px 9px; border-radius:10px; background:var(--soft);
         color:var(--main-d); white-space:nowrap; }
  .tag.ok { background:#e3f3ea; color:var(--ok); } .tag.warn { background:#fbeee4; color:var(--warn); }
  .tag.bad { background:#fde8ea; color:var(--bad); }
  .course { display:flex; gap:12px; justify-content:space-between; align-items:center; padding:11px 0;
            border-bottom:1px solid var(--line); }
  .course:last-child { border-bottom:0; }
  .course .t { font-weight:600; }
  .course .cact { display:grid; grid-template-columns:116px 116px; gap:8px; flex:0 0 auto; white-space:nowrap; }
  .course .cact > * { box-sizing:border-box; height:38px; margin:0; padding:0 6px; border-radius:10px; font-size:14px; font-weight:600;
    display:flex; align-items:center; justify-content:center; }
  .course .cact > .tag { border:1px solid transparent; }
  @media (max-width:560px) { .course .cact { grid-template-columns:104px; } }
  .crumb { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .crumb button { border-radius:20px; padding:7px 16px; font-weight:700; color:var(--main-d); border-color:var(--main); background:#fff; }
  .crumb button:hover { background:var(--main); color:#fff; }
  .crumb span { font-size:19px; color:var(--main-d); }
  .hero { background:var(--grad); color:#fff; border-radius:18px; padding:22px 22px; margin-bottom:16px;
          box-shadow:0 8px 24px rgba(76,51,153,.22); }
  .hero h2 { font-size:24px; margin:0; } .hero p { margin:0; opacity:.92; }
  .yearwrap { display:flex; gap:16px; align-items:flex-start; }
  .yearwrap .terms { flex:1; min-width:0; }
  .years { flex:0 0 132px; display:flex; flex-direction:column; gap:8px; position:sticky; top:12px; }
  .years button { text-align:left; padding:10px 14px; border-radius:14px; background:#fff; border:1px solid var(--line); }
  .years button span { display:block; font-size:22px; color:var(--main-d); line-height:1.2; }
  .years button small { color:var(--sub); font-size:12px; }
  .years button.on { background:var(--grad); border-color:transparent; box-shadow:0 6px 16px rgba(76,51,153,.25); }
  .years button.on span, .years button.on small { color:#fff; }
  @media (max-width:640px) {
    .yearwrap { flex-direction:column; }
    .years { flex:none; flex-direction:row; flex-wrap:wrap; position:static; width:100%; }
    .years button { flex:1 1 110px; }
  }
  .terms { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px; margin-bottom:16px; }
  .term { text-align:left; background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px 18px 16px;
          box-shadow:0 3px 14px rgba(76,51,153,.07); position:relative; overflow:hidden; }
  .term::before { content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--grad); }
  .term:hover { transform:translateY(-3px); box-shadow:0 10px 26px rgba(76,51,153,.18); border-color:var(--main); }
  .term .tt { font-size:20px; color:var(--main-d); display:block; margin-bottom:4px; }
  .term .go2 { display:block; margin-top:10px; color:var(--pink); font-weight:700; font-size:14px; }
  .week { table-layout:fixed; min-width:520px; margin:6px 0 12px; }
  .week th { text-align:center; background:var(--soft); color:var(--main-d); font-size:14px; border:1px solid var(--line); }
  .week td { text-align:center; vertical-align:middle; border:1px solid var(--line); height:92px; padding:8px 6px; }
  .week td.on { background:linear-gradient(160deg,#f1ebff,#ffe9ef); }
  .week td b { display:block; color:var(--main-d); font-size:14px; line-height:1.3; }
  .week td span { display:block; font-size:12px; color:var(--sub); }
  .week td .none { color:#bdb6cf; }
  .dlist { max-height:340px; overflow:auto; padding:6px 8px; border:1px solid var(--line); border-radius:9px; }
  .drow { display:flex; gap:8px; align-items:center; padding:3px 0; }
  .drow .chip { flex:0 0 86px; text-align:center; padding:5px 4px; font-size:13px; }
  .drow .no { flex:0 0 34px; font-size:12px; color:var(--sub); text-align:right; }
  .drow input { flex:1; min-width:0; visibility:hidden; padding:5px 9px; }
  .drow.on input { visibility:visible; }
  .pal { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:8px 0; }
  .pal button { border-radius:16px; padding:4px 12px; }
  .pal button.on { background:var(--main); color:#fff; border-color:var(--main); }
  /* 수강생 카드 (2열) */
  .ros { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px; }
  .ros .st { display:flex; align-items:center; gap:10px; padding:7px 10px; border:1px solid var(--line); border-radius:11px; background:#faf8fe; }
  .ros .st:hover { border-color:var(--main); background:var(--soft); }
  .ros .st .hb { font-variant-numeric:tabular-nums; color:var(--main-d); font-weight:700; min-width:48px; }
  .ros .st .nm { flex:1; min-width:0; font-weight:600; }
  .ros .st .kd { font-size:12px; color:var(--sub); white-space:nowrap; }
  @media (max-width:640px) { .ros { grid-template-columns:1fr; } }
  /* 출석 체크 표: 머리줄과 학번·이름 칸 고정 */
  .attwrap { max-height:72vh; overflow:auto; border:1px solid var(--line); border-radius:12px; background:#fff; }
  .att { font-size:13px; border-collapse:separate; border-spacing:0; width:max-content; min-width:100%; }
  .att th, .att td { text-align:center; padding:3px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); white-space:nowrap; background:#fff; }
  .att thead th { position:sticky; top:0; z-index:2; background:#f3eefc; color:var(--main-d); font-size:12px; height:38px; line-height:1.2; }
  .att thead tr.r2 th { top:38px; height:22px; font-weight:500; }
  .att th.d { cursor:pointer; } .att th.d:hover { background:#e5dbfa; }
  .att .c1, .att .c2 { position:sticky; z-index:1; background:#faf8fe; }
  .att .c1 { left:0; width:64px; min-width:64px; font-variant-numeric:tabular-nums; color:var(--main-d); font-weight:700; }
  .att .c2 { left:64px; width:86px; min-width:86px; text-align:left; padding-left:8px; font-weight:600; box-shadow:3px 0 5px -3px rgba(76,51,153,.25); }
  .att thead .c1, .att thead .c2 { z-index:3; background:#f3eefc; text-align:center; padding-left:3px; }
  .att thead th.kx, .att td.kx { background:#eeeaf3; color:#9a93ad; }
  .att thead th.km { background:#fff3dc; }
  .att thead th em { font-style:normal; font-size:10px; padding:0 4px; border-radius:6px; background:#fff; border:1px solid currentColor; }
  .att thead th.km em { color:var(--warn); } .att thead th.sel { outline:2px solid var(--main); outline-offset:-2px; }
  .dpanel { position:relative; border:1px solid var(--main); background:#faf8fe; border-radius:12px; padding:12px 14px; margin:8px 0; }
  .dpanel .x { position:absolute; right:10px; top:10px; }
  .dpanel label { margin-top:6px; }
  .att td.rowfill { cursor:pointer; } .att td.rowfill:hover { color:var(--main); text-decoration:underline; }
  .att tbody tr:hover td { background:#fbf9ff; } .att tbody tr:hover .c1, .att tbody tr:hover .c2 { background:var(--soft); }
  .att td button, .att td .ro { display:inline-block; min-width:42px; height:27px; line-height:25px; padding:0 4px; border:1px solid var(--line); border-radius:8px;
      background:#fff; font-size:12px; color:var(--ink); }
  .att td button:hover { border-color:var(--main); box-shadow:0 0 0 2px rgba(106,75,196,.15); }
  .att .m-o { background:#e9f7ef; border-color:#b5dfc6; color:var(--ok); font-weight:700; font-size:14px; }
  .att .m-x { background:#fdecee; border-color:#f3bcc3; color:var(--bad); font-weight:700; font-size:14px; }
  .att .m-t { background:#f1ebff; border-color:#d6c8f5; color:var(--main-d); font-size:11px; }
  /* 학생: 진행 중인 방과후학교 요약 + 나의 출석 */
  .today { border-radius:16px; padding:14px 16px; margin:0 0 14px; background:linear-gradient(135deg,#f3eeff,#ffeef6); border:1px solid #e3d8ff; }
  .today h3 { margin:0 0 8px; font-size:15px; }
  .today .tc { display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:#fff; border-radius:12px; padding:10px 12px; margin-top:6px; box-shadow:0 2px 8px rgba(76,51,153,.08); }
  .today .tc b { font-size:16px; } .today .tc .sp { flex:1; }
  .today .tc.off b { text-decoration:line-through; color:#999; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:8px 0 4px; }
  .tile { border:1px solid var(--line); border-radius:14px; padding:12px 14px; background:#fff; }
  .tile small { display:block; color:var(--sub,#777); font-size:12px; } .tile b { font-size:22px; } .tile span { font-size:12px; color:#777; }
  .todo { margin:0; padding-left:1.2em; } .todo li { margin:3px 0; }
  .sheet.rep th { background:#f1f1f1; } .sheet.rep td.l { text-align:left; }
  .sheet.cert { padding:10pt 6pt; } .sheet.cert h2 { font-size:22pt; letter-spacing:6pt; margin:10pt 0 22pt; border:none; }
  .sheet.cert .info { font-size:12pt; text-align:left; margin:0 0 10pt; } .sheet.cert .foot { margin-top:28pt; font-size:12pt; }
  .sheet.cert .foot b { display:block; font-size:19pt; letter-spacing:4pt; margin-top:14pt; }
  .homebox { border:2px solid var(--main); border-radius:18px; background:#fff; padding:18px 18px 8px; margin:4px 0 16px; box-shadow:0 6px 20px rgba(76,51,153,.12); }
  .homebox .hh { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding-bottom:10px; border-bottom:1px dashed var(--line); }
  .homebox .tt { font-size:21px; color:var(--main-d); margin:0 6px; }
  .homebox .inner { border-top:1px dashed var(--line); margin-top:10px; padding-top:4px; }
  .homebox .inner h2 { font-size:15px; margin:14px 0 6px; color:var(--main-d); }
  .mya { border:1px solid var(--line); border-radius:13px; padding:11px 12px; margin:10px 0; background:#fcfbff; }
  .mya .hd { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; }
  .mya .hd .t { font-weight:700; } .mya .hd .rt { margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .mya .bar { height:7px; border-radius:6px; background:#ece6f7; margin:8px 0 2px; overflow:hidden; }
  .mya .bar i { display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,#6a4bc4,#ff6f91); }
  .ads { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .ad { min-width:62px; text-align:center; border:1px solid var(--line); border-radius:10px; padding:4px 6px; background:#fff; line-height:1.25; }
  .ad small { display:block; font-size:11px; color:var(--sub); } .ad b { font-size:14px; font-weight:700; }
  .ad.m-o { background:#e9f7ef; border-color:#b5dfc6; } .ad.m-o b { color:var(--ok); }
  .ad.m-x { background:#fdecee; border-color:#f3bcc3; } .ad.m-x b { color:var(--bad); }
  .ad.m-t { background:#f1ebff; border-color:#d6c8f5; } .ad.m-t b { color:var(--main-d); font-size:12px; }
  .ad.kx { background:#eeeaf3; } .ad.kx b, .ad.ft b, .ad.no b { color:#a59fb8; font-size:12px; font-weight:500; }
  .ad.ft { border-style:dashed; }
  .need { border:1px solid #f0c9a8; background:#fff6ec; color:#7a4a1c; border-radius:11px; padding:10px 13px; font-size:14px; margin-bottom:6px; }
  .req { color:var(--bad); font-weight:700; }
  .miss { border-color:var(--bad) !important; box-shadow:0 0 0 3px rgba(192,48,63,.16); border-radius:9px; }
  div.miss { padding:4px 6px; border:1px solid var(--bad); }
  .missbox { border:1px solid #f3bcc3; background:#fdecee; border-radius:11px; padding:10px 13px; margin-top:12px; line-height:1.9; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; max-height:170px; overflow:auto; padding:6px;
           border:1px solid var(--line); border-radius:9px; }
  .chip { font-size:12px; padding:2px 7px; border-radius:6px; }
  .chip.on { background:var(--main); color:#fff; border-color:var(--main); }
  .chip:not(.on) { text-decoration:line-through; color:var(--sub); }
  #modal { position:fixed; inset:0; background:rgba(42,33,64,.5); display:flex; align-items:flex-start;
           justify-content:center; padding:4vh 12px; overflow:auto; z-index:10; }
  #modal .box { background:#fff; border-radius:18px; padding:20px; width:100%; max-width:980px; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#2a2140; color:#fff;
           padding:10px 18px; border-radius:10px; z-index:20; max-width:90vw; }
  #toast.err { background:var(--bad); }
  .hidden { display:none !important; }

<script>
"use strict";
/* ------------------------------------------------------------------ 기본 */
const cfg = window.AS_CONFIG || {};
const DAY = ['', '월', '화', '수', '목', '금', '토', '일'];

const daysText = (t) => (t.days || []).map((d) => DAY[d]).join('·');     // 유형 또는 강좌의 요일
// 화면에 보여 줄 유형: 사용 중인 유형 + (숨김 유형이라도) 이 방과후학교에 강좌가 있는 유형

const typeDatesOf = (code) => ((S.type_dates || []).find((x) => x.type_code === code) || {}).dates || [];

function toast(msg, err) {
  const t = $('#toast');
  t.textContent = msg; t.className = err ? 'err' : '';
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.add('hidden'), err ? 4500 : 2500);
}
async function rpc(fn, args) {
  const { data, error } = await sb.rpc(fn, args || {});
  if (error) throw new Error(error.message || '요청을 처리하지 못했습니다.');
  return data;
}
const api = (fn, args) => rpc(fn, Object.assign({ p_token: token }, args || {}));

async function run(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    if (/만료/.test(e.message)) { setToken(null); S = null; render(); }
    toast(e.message, true); return false;
  }
}
function setToken(t) {
  token = t;
  try { t ? sessionStorage.setItem('as_token', t) : sessionStorage.removeItem('as_token'); } catch (e) {}
}
function setTerm(id) {
  termId = id || null;
  try { termId ? sessionStorage.setItem('as_term', termId) : sessionStorage.removeItem('as_term'); } catch (e) {}
}
function normState(X) {                     // 이전 구조와도 호환되도록 빈 값 채우기
  X.type_dates = X.type_dates || []; X.changes = X.changes || []; X.my_att = X.my_att || []; X.my_wait = X.my_wait || [];
  X.courses.forEach((c) => { c.days = c.days || (X.types.find((t) => t.code === c.type_code) || {}).days || []; c.period = c.period || ''; c.contents = c.contents || {}; });
  return X;
}
// 오늘 날짜가 운영 기간 안에 있는 방과후학교 (여럿이면 가장 늦게 시작한 것)
function currentTerm(terms) {
  const today = fmt(new Date());
  return terms.filter((t) => t.start_date && t.end_date && t.start_date <= today && today <= t.end_date)
              .sort((x, y) => (x.start_date < y.start_date ? 1 : -1))[0] || null;
}
async function refresh() {
  S = await api('as_get_state', { p_term: termId });
  if (termId && !S.term) setTerm(null);
  normState(S);
  R = S.me.role === 'teacher' && S.term ? await api('as_get_roster', { p_term: termId }) : null;
  ATT = new Map(((R && R.attendance) || []).map((x) => [attKey(x[0], x[1], x[2], x[3]), x[4]]));
  HOME = null;                                   // 학생이 목록 화면에 있을 때: 진행 중인 방과후학교의 내 수강 내역
  if (S.me.role === 'student' && !S.term) {
    const cur = currentTerm(S.terms);
    if (cur) { try { HOME = normState(await api('as_get_state', { p_term: cur.id })); } catch (e) { HOME = null; } }
  }
  document.title = S.term ? S.term.title : BRAND;
  render();
}
function genDates(start, end, days) {
  const out = [];
  if (!start || !end) return out;
  const d = toDate(start), e = toDate(end);
  while (d <= e) { if (days.includes(d.getDay())) out.push(fmt(d)); d.setDate(d.getDate() + 1); }
  return out;
}
function downloadCsv(name, rows) {
  const text = '﻿' + rows.map((r) => r.map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function openModal(html) { $('#modalBox').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal() { $('#modal').classList.add('hidden'); $('#modalBox').innerHTML = ''; view.detailId = null; }
function doPrint(html) { $('#print').innerHTML = html; window.print(); }
function loadScript(src) { return new Promise((ok, no) => { const e = document.createElement('script'); e.src = src; e.onload = ok; e.onerror = () => no(new Error('PDF 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.')); document.head.appendChild(e); }); }
// 여러 장의 문서(.sheet)를 하나의 PDF 파일로 저장합니다. 출석부는 가로, 강의계획서는 세로 A4.
async function savePdf(html, filename) {
  const busy = document.createElement('div'); busy.id = 'busy'; busy.innerHTML = '<div>PDF를 만드는 중…</div>'; document.body.appendChild(busy);
  const stage = document.createElement('div'); stage.id = 'pdfstage'; stage.innerHTML = html; document.body.appendChild(stage);
  try {
    if (!window.html2canvas) await loadScript('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js');
    if (!window.jspdf) await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const sheets = [...stage.querySelectorAll('.sheet')];
    let pdf = null;
    for (let i = 0; i < sheets.length; i++) {
      const el = sheets[i], land = !el.classList.contains('plan'), W = land ? 297 : 210, H = land ? 210 : 297, M = land ? 10 : 14;
      el.style.width = Math.round((W - 2 * M) * 96 / 25.4) + 'px';                 // 종이 폭에 맞춘 화면 폭
      busy.firstChild.textContent = `PDF를 만드는 중… ${i + 1} / ${sheets.length}`;
      const canvas = await window.html2canvas(el, { scale: 2, backgroundColor: '#ffffff', logging: false });
      if (!pdf) pdf = new window.jspdf.jsPDF({ orientation: land ? 'landscape' : 'portrait', unit: 'mm', format: 'a4' });
      else pdf.addPage('a4', land ? 'landscape' : 'portrait');
      const r = Math.min((W - 2 * M) / canvas.width, (H - 2 * M) / canvas.height);   // 한 쪽에 들어가도록 맞춤
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', (W - canvas.width * r) / 2, M, canvas.width * r, canvas.height * r);

  finally { stage.remove(); busy.remove(); }
}

/* ------------------------------------------------------------------ 화면 */

/* 방과후학교(운영 단위) 목록 — 학기·방학마다 하나씩 쌓입니다 */

function yearOf(t) {

function studentView() {

  }

// 담임: 우리 반 결석 알림
function hrAlerts(key) {
  const t = todayStr(), now = new Date(), mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const wk = fmt(mon), studs = new Map(studentsOf(key).map((s) => [s.id, s])), week = [], streak = [];
  R.enrollments.forEach((e) => {
    const s = studs.get(e.student_id), c = courseById(e.course_id);
    if (!s || !c || c.status === 'cancelled') return;
    const ns = slotsOf(c), past = c.dates.filter((d) => d <= t);
    const st = (d) => { const ms = Array.from({ length: ns }, (_, i) => ATT.get(attKey(c.id, s.id, d, i + 1)) || ''); return ms.includes('/') ? 'x' : ms.some(Boolean) ? 'o' : ''; };

    let n = 0; for (let i = past.length - 1; i >= 0 && st(past[i]) === 'x'; i--) n++;
    if (n >= 2) streak.push({ s, c, n, last: past[past.length - 1] });
  });
  week.sort((a, b) => a.s.number - b.s.number || (a.d < b.d ? -1 : 1)); streak.sort((a, b) => b.n - a.n || a.s.number - b.s.number);
  return `<div class="card"><h2>방과후 결석 알림</h2>
    <p class="sub">선생님들이 입력한 출석부에서 우리 반 학생의 결석(/)만 모았습니다. 이번 주 = ${dlabel(wk)}부터 오늘까지.</p>
    <h3>연속 결석 (최근 2회 이상)</h3>

// 관리자: 운영 현황 + 교사별 시수
function teacherHours() {
  const t = todayStr(), m = new Map(), months = new Set();
  S.courses.filter((c) => c.status !== 'cancelled').forEach((c) => {
    const z = m.get(c.teacher_id) || { name: c.teacher_name, n: 0, plan: 0, done: 0, by: {} }; const h = sessHours(c);
    z.n++; z.plan += c.dates.length * h;
    c.dates.filter((d) => d <= t).forEach((d) => { const k = d.slice(0, 7); months.add(k); z.by[k] = (z.by[k] || 0) + h; z.done += h; });
    m.set(c.teacher_id, z);
  });
  return { rows: [...m.values()].sort((a, b) => a.name.localeCompare(b.name, 'ko')), months: [...months].sort() };
}

function classList() {

}
function classOptions(sel, first) {

}
function studentsOf(key) {
  if (!key) return [];
  const [g, c] = key.split('-').map(Number);
  return R.students.filter((s) => s.grade === g && s.class === c);
}
function classTable(key) {
  const byStu = new Map();
  R.enrollments.forEach((e) => {
    const c = courseById(e.course_id);

    byStu.get(e.student_id)[c.type_code] = c.title;
  });
  const types = shownTypes();
  const head = ['번호', '이름', ...types.map((t) => t.name)];
  const rows = studentsOf(key).map((s) => {
    const m = byStu.get(s.id) || {};
    return [s.number, s.name, ...types.map((t) => m[t.code] || '')];
  });
  return { head, rows };
}

/* 관리자: 전체 강좌 출석부 현황 + 결강·보강 현황 */
function attStats() {
  const st = new Map();                       // 강좌 → {n:입력 칸, o:출석, x:결석}
  ATT.forEach((m, k) => { const cid = +k.split('|')[0]; const z = st.get(cid) || { n: 0, o: 0, x: 0 }; z.n++; if (m === '◯') z.o++; else if (m === '/') z.x++; st.set(cid, z); });
  return st;
}
function attAllView() {
  const st = attStats(), today = fmt(new Date());

    const t = typeOf(c.type_code), z = st.get(c.id) || { n: 0, o: 0, x: 0 }, done = c.dates.filter((d) => d <= today).length;
    const cells = c.enrolled * done * slotsOf(c), ch = changesOf(c.id), pend = ch.filter((x) => !x.new_date).length;
    const pct = (a, b) => (b ? Math.round((a / b) * 100) + '%' : '–');

      <td class="nowrap">${cells ? `<span class="tag ${z.n >= cells ? 'ok' : z.n ? 'warn' : ''}">${pct(Math.min(z.n, cells), cells)}</span>` : '–'}</td>
      <td class="nowrap">${pct(z.o, z.o + z.x)}</td>

  return `<div class="card"><h2>출석부 전체</h2>

    <tbody>${rows || '<tr><td colspan="9">강좌가 없습니다.</td></tr>'}</tbody></table></div>
    <div class="mt"><button class="pri" data-a="pdfAttAll">전체 출석부 PDF로 저장</button> <button data-a="printAttAll">전체 출석부 인쇄</button> <button data-a="csvAttAll">출석 기록 CSV 내려받기</button></div></div>

const slotsOf = (c) => Math.max(1, Math.round(c.hours ?? hoursOf(c.period)));

const changesOf = (cid) => (S.changes || []).filter((x) => x.course_id === cid);
function dateCols(c) {
  const ch = changesOf(c.id), out = [];
  const byOrig = new Map(ch.map((x) => [x.orig_date, x])), byNew = new Map(ch.filter((x) => x.new_date).map((x) => [x.new_date, x]));
  [...new Set([...c.dates, ...ch.map((x) => x.orig_date)])].sort().forEach((d) => {
    if (!c.dates.includes(d) && byOrig.has(d)) out.push({ d, kind: 'x', ch: byOrig.get(d) });           // 결강
    else out.push({ d, kind: byNew.has(d) ? 'm' : '', ch: byNew.get(d) || null });                        // 보강 / 일반
  });
  return out;
}

async function saveAtt(courseId, items) {       // 화면을 먼저 바꾸고 저장, 실패하면 되돌림
  const before = items.map((it) => [attKey(courseId, it.s, it.d, it.slot), ATT.get(attKey(courseId, it.s, it.d, it.slot))]);
  items.forEach((it) => { const k = attKey(courseId, it.s, it.d, it.slot); it.m ? ATT.set(k, it.m) : ATT.delete(k); });
  const paint = () => items.forEach((it) => { const b = document.querySelector(`[data-a=att][data-s="${it.s}"][data-d="${it.d}"][data-i="${it.slot}"]`);
    if (b) { const m = ATT.get(attKey(courseId, it.s, it.d, it.slot)) || ''; b.textContent = m; b.className = markCls(m); } });

}

  if (!txt('textbook')) add('교재명', q('[name=textbook]'));

  const rows = [...f.querySelectorAll('#dateChips .drow.on')];

  return miss;
}

  }, draft ? '임시 저장했습니다. 나머지 항목도 채워서 [제출]해 주세요.' : '제출(저장)되었습니다.');

const hoursOf = (period) => { const m = /^([\d·,~\s]+)교시/.exec(period || ''); return m ? (m[1].match(/\d+/g) || []).length || 2 : 2; };
const readContents = () => { const o = {}; document.querySelectorAll('#dateChips [data-content]').forEach((i) => { if (i.value.trim()) o[i.dataset.content] = i.value.trim(); }); return o; };
function reopenDetail() {            // 가로 스크롤 위치를 유지한 채 상세 화면을 다시 그림

// 보강 날짜에 다른 수업이 겹치는 수강생 수 (같은 방과후학교의 다른 강좌 기준)
function overlapOn(c, date) {
  const mine = new Set(rosterOf(c.id).map((s) => s.id)), hit = new Map();
  R.enrollments.forEach((e) => { if (e.course_id === c.id || !mine.has(e.student_id)) return;
    const o = courseById(e.course_id); if (o && o.status !== 'cancelled' && o.dates.includes(date)) hit.set(e.student_id, o.title); });
  return hit;
}
function okMakeup(c, date) {
  if (!date) return true;
  if (toDate(date).getDay() === 0 || toDate(date).getDay() === 6) { if (!confirm(`${dlabel(date)}은(는) 주말입니다. 그대로 보강일로 넣을까요?`)) return false; }
  const hit = overlapOn(c, date);
  if (!hit.size) return true;
  const names = [...hit.entries()].slice(0, 5).map(([sid, t]) => `${(R.students.find((s) => s.id === sid) || {}).name}(${t})`).join(', ');
  return confirm(`${dlabel(date)}에 다른 방과후 수업이 있는 수강생이 ${hit.size}명 있습니다.
${names}${hit.size > 5 ? ' 외' : ''}

그래도 이 날로 보강을 잡을까요?`);
}
const formDays = () => [...document.querySelectorAll('#modal [name=days]:checked')].map((x) => +x.value);
function fillDates(dates, typeCode, days, contents, reset) {
  // 이미 눌러서 뺀 날짜는 요일을 바꿔도 빠진 채로 둡니다([다시 채우기]를 누르면 모두 되살림)
  const off = new Set(reset ? [] : [...document.querySelectorAll('#dateChips .drow:not(.on) .chip')].map((b) => b.dataset.d));
  days = days || formDays();
  const txt = Object.assign({}, contents || {}, readContents());      // 적어 둔 수업 내용은 유지
  // 유형별 수업 날짜가 등록되어 있으면 그 날짜(선택한 요일만), 없으면 운영 기간·요일로 계산
  const td = typeDatesOf(typeCode);
  const all = td.length ? td.filter((d) => days.includes(toDate(d).getDay())) : genDates(S.term.start_date, S.term.end_date, days);
  const on = new Set((dates || all).filter((d) => !off.has(d)));
  const list = [...new Set([...all, ...on])].sort();
  $('#dateChips').innerHTML = list.length
    ? list.map((d) => `<div class="drow ${on.has(d) ? 'on' : ''}"><button type="button" class="chip ${on.has(d) ? 'on' : ''}" data-a="chip" data-d="${d}">${md(d)}(${dow(d)})</button>
        <span class="no"></span><input data-content="${d}" value="${esc(txt[d] || '')}" placeholder="수업 내용" maxlength="200"></div>`).join('')
    : '<span class="sub">표시할 날짜가 없습니다. 수업 요일을 골랐는지 확인해 주세요. 운영 기간이나 유형별 수업 날짜는 관리자가 [일정·설정]에서 입력합니다.</span>';
  countDates();
}
function countDates() {
  $('#dateCount').textContent = `(${document.querySelectorAll('#dateChips .chip.on').length}일)`;
  let n = 0;                                                            // 회차 번호 다시 매기기
  document.querySelectorAll('#dateChips .drow').forEach((r) => { r.querySelector('.no').textContent = r.classList.contains('on') ? `${++n}회` : ''; });
}

      cells.forEach(([d, i]) => { if (ATT.get(attKey(c.id, sid, d, i))) items.push({ s: sid, d, slot: i, m: '' }); });
    } else cells.forEach(([d, i]) => { if (!ATT.get(attKey(c.id, sid, d, i))) items.push({ s: sid, d, slot: i, m: view.mark }); });
    if (items.length) saveAtt(c.id, items); else toast(view.mark === '' ? '지울 표시가 없습니다.' : '채울 빈칸이 없습니다.');
  },
  attCol: (el) => { const c = courseById(+el.dataset.id), d = el.dataset.d; if (!view.mark) return toast('먼저 넣을 표시를 골라 주세요.', true);
    const items = []; rosterOf(c.id).forEach((s) => { for (let i = 1; i <= slotsOf(c); i++) if (!ATT.get(attKey(c.id, s.id, d, i))) items.push({ s: s.id, d, slot: i, m: view.mark }); });
    if (items.length) saveAtt(c.id, items); },
  viewPlan: (el) => { const c = courseById(+el.dataset.id); openModal(`<div class="row" style="justify-content:space-between"><h2>${esc(c.title)} 강의계획서</h2>
      <div style="flex:0 0 auto"><button data-a="printPlan" data-id="${c.id}">인쇄</button> <button data-a="pdfPlan" data-id="${c.id}">PDF 저장</button> <button data-a="close">닫기</button></div></div>
      <div class="pvbox">${planHtml(c)}</div>`); },
  pdfPlan: (el) => { const c = courseById(+el.dataset.id); savePdf(planHtml(c), `강의계획서_${c.title}.pdf`); },
  pdfPlans: () => { const cs = S.courses.filter((c) => c.status !== 'cancelled'); if (!cs.length) return toast('저장할 강좌가 없습니다.', true); savePdf(cs.map(planHtml).join(''), `강의계획서_전체_${S.term.title}.pdf`); },
  pdfAttAll: () => { const cs = S.courses.filter((c) => c.status !== 'cancelled' && c.enrolled); if (!cs.length) return toast('저장할 출석부가 없습니다.', true); savePdf(cs.map(attendanceHtml).join(''), `출석부_전체_${S.term.title}.pdf`); },
  pdfAtt: (el) => { const c = courseById(+el.dataset.id); savePdf(attendanceHtml(c), `출석부_${c.title}.pdf`); },
  printAttAll: () => { const cs = S.courses.filter((c) => c.status !== 'cancelled' && c.enrolled); if (!cs.length) return toast('인쇄할 출석부가 없습니다.', true); doPrint(cs.map(attendanceHtml).join('')); },
  cert: (el) => doPrint(certHtml(el.dataset.h ? HOME : S)),
  certPdf: (el) => { const X = el.dataset.h ? HOME : S; savePdf(certHtml(X), `수강확인서_${X.me.name}.pdf`); },
  attToday: (el) => { view.detailId = +el.dataset.id; view.addCls = ''; view.dateSel = todayStr(); openModal(detailView(courseById(view.detailId)));
    setTimeout(() => { const th = document.querySelector('#modal th.sel'); if (th && th.scrollIntoView) th.scrollIntoView({ inline: 'center', block: 'nearest' }); }, 50); },
  allPresent: async (el) => {
    const c = courseById(+el.dataset.id), d = el.dataset.d, items = [];
    rosterOf(c.id).forEach((s) => { for (let i = 1; i <= slotsOf(c); i++) if (!ATT.get(attKey(c.id, s.id, d, i))) items.push({ s: s.id, d, slot: i, m: '◯' }); });
    if (!items.length) return toast('빈칸이 없습니다.');
    await saveAtt(c.id, items); toast(`${c.title}: 빈칸 ${items.length}칸을 출석(◯)으로 채웠습니다.`); render();
  },
  csvHours: () => {
    const t = todayStr(), rows = [['교사', '유형', '강좌명', '회당 시간', '월', '진행 횟수', '운영 시수']];
    S.courses.filter((c) => c.status !== 'cancelled').forEach((c) => { const by = {}; c.dates.filter((d) => d <= t).forEach((d) => { by[d.slice(0, 7)] = (by[d.slice(0, 7)] || 0) + 1; });
      Object.keys(by).sort().forEach((k) => rows.push([c.teacher_name, typeOf(c.type_code).name, c.title, sessHours(c), k, by[k], r1(by[k] * sessHours(c))])); });
    downloadCsv(`시수집계_${S.term.title}.csv`, rows);
  },
  pdfResult: () => savePdf(resultHtml(), `운영결과보고_${S.term.title}.pdf`),
  printResult: () => doPrint(resultHtml()),
  csvAttAll: () => {
    const rows = [['강좌명', '교사', '학번', '이름', '날짜', '교시', '표시']];
    S.courses.forEach((c) => rosterOf(c.id).forEach((s) => c.dates.forEach((d) => { for (let i = 1; i <= slotsOf(c); i++) { const m = ATT.get(attKey(c.id, s.id, d, i)); if (m) rows.push([c.title, c.teacher_name, hakbun(s), s.name, d, i, m]); } })));
    downloadCsv('출석기록.csv', rows);
  },
  csvChanges: () => downloadCsv('결강보강현황.csv', [['강좌명', '교사', '결강일', '보강일', '사유', '처리자', '처리일'],
    ...(S.changes || []).map((x) => { const c = courseById(x.course_id) || {}; return [c.title, c.teacher_name, x.orig_date, x.new_date || '미정', x.reason, x.by || '', String(x.at || '').slice(0, 10)]; })]),
  posterPdf: (el) => run(async () => { const key = el.dataset.v, [g, c] = key.split('-'); await savePdf(posterHtml(key, await qrDataUrl(siteUrl())), `수강현황_${g}학년${c}반_${S.term.title}.pdf`); }),
  posterPrint: (el) => run(async () => { doPrint(posterHtml(el.dataset.v, await qrDataUrl(siteUrl()))); }),
  printPlan: (el) => doPrint(planHtml(courseById(+el.dataset.id))),
  printPlans: () => { const cs = S.courses.filter((c) => c.status !== 'cancelled'); if (!cs.length) return toast('인쇄할 강좌가 없습니다.', true); doPrint(cs.map(planHtml).join('')); },
  datesReset: () => fillDates(null, $('#modal [name=type_code]').value, null, null, true),
  detail: (el) => { view.detailId = +el.dataset.id; view.addCls = ''; view.dateSel = ''; openModal(detailView(courseById(view.detailId))); },
  assign: (el) => run(async () => { await api('as_assign', { p_course: +el.dataset.id, p_student: +el.dataset.s }); await refresh(); }, '지정되었습니다.'),
  unassign: (el) => { if (confirm('이 학생을 수강생에서 제외할까요?')) run(async () => { await api('as_unassign', { p_course: +el.dataset.id, p_student: +el.dataset.s }); await refresh(); }, '제외되었습니다.'); },
  status: (el) => {
    const c = courseById(+el.dataset.id), v = el.dataset.v;
    if (v === 'cancelled' && !confirm(`'${c.title}' 강좌를 폐강할까요?\n수강생 ${c.enrolled}명의 신청 내역이 삭제되며 되돌릴 수 없습니다.`)) return;
    run(async () => { await api('as_set_course_status', { p_course: c.id, p_status: v }); await refresh(); }, '변경되었습니다.');
  },
  printAtt: (el) => doPrint(attendanceHtml(courseById(+el.dataset.id))),
  csvRoster: (el) => {
    const c = courseById(+el.dataset.id);
    downloadCsv(`${c.title}_명단.csv`, [['학번', '학년', '반', '번호', '이름', '구분'],
      ...rosterOf(c.id).map((s) => [hakbun(s), s.grade, s.class, s.number, s.name, s.assigned ? '교사 지정' : '학생 신청'])]);
  },
  csvCourses: () => downloadCsv('강좌현황.csv', [['유형', '요일', '강좌명', '교사', '강의실', '학년', '인원', '정원', '상태'],
    ...S.courses.map((c) => { const t = typeOf(c.type_code); return [t.name, daysText(c) + (c.period ? ' ' + c.period : ''), c.title, c.teacher_name, c.room, c.grades.join(' '), c.enrolled, c.capacity ?? '', STATUS[c.status]]; })]),
  csvCls: () => { const { head, rows } = classTable(view.cls); downloadCsv(`${view.cls}반_수강현황.csv`, [head, ...rows]); },
  printCls: () => {
    const { head, rows } = classTable(view.cls), [g, c] = view.cls.split('-');
    doPrint(`<section class="sheet"><h2>${g}학년 ${c}반 방과후학교 수강 현황</h2><p>${esc(S.term.title)} · ${periodText()}</p>
      <table><thead><tr>${head.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${rows.map((r) => `<tr>${r.map((v) => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></section>`);
  },
  pwReset: (el) => { if (confirm(`${el.dataset.n}의 비밀번호를 2026으로 초기화할까요?`)) run(() => api('as_reset_password', { p_role: el.dataset.r, p_id: +el.dataset.id }), '초기화되었습니다.'); },
  stuDel: (el) => { if (confirm(`${el.dataset.n} 학생을 삭제할까요? 수강 내역도 함께 삭제됩니다.`)) run(async () => { await api('as_delete_student', { p_id: +el.dataset.id }); await refresh(); }, '삭제되었습니다.'); },
  teaDel: (el) => { if (confirm(`${el.dataset.n} 선생님 계정을 삭제할까요?`)) run(async () => { await api('as_delete_teacher', { p_id: +el.dataset.id }); await refresh(); }, '삭제되었습니다.'); },
  manager: (el) => run(async () => { await api('as_set_manager', { p_id: +el.dataset.id, p_on: el.dataset.v === '1' }); await refresh(); }, '변경되었습니다.'),
  admin: (el) => run(async () => { await api('as_set_admin', { p_id: +el.dataset.id, p_admin: el.dataset.v === '1' }); await refresh(); }, '변경되었습니다.'),
};

const F = {
  login: (fd) => run(async () => {
    const r = loginRole === 'student'
      ? await rpc('as_login_student', { p_grade: +fd.get('grade'), p_class: +fd.get('class'), p_number: +fd.get('number'), p_name: fd.get('name'), p_pw: fd.get('pw') })
      : await rpc('as_login_teacher', { p_name: fd.get('name'), p_pw: fd.get('pw') });
    setToken(r.token); tab = 'my'; await refresh();
  }),
  pw: (fd) => {
    if (fd.get('n1') !== fd.get('n2')) return toast('새 비밀번호가 서로 다릅니다.', true);
    return run(async () => { await api('as_change_password', { p_old: fd.get('old'), p_new: fd.get('n1') }); closeModal(); await refresh(); }, '비밀번호가 변경되었습니다.');
  },
  course: (fd, submitter, f) => {
    const draft = !!(submitter && submitter.name === 'draft');
    f.querySelectorAll('.miss').forEach((el) => el.classList.remove('miss'));
    const box = f.querySelector('#missBox'); box.classList.add('hidden');
    if (!(fd.get('title') || '').trim()) { const t = f.querySelector('[name=title]'); t.classList.add('miss'); t.focus(); return toast('강좌명은 꼭 입력해 주세요.', true); }
    if (!draft) {
      const miss = courseMissing(f);
      if (miss.length) {
        miss.forEach((m) => m.el.classList.add('miss'));
        const labels = miss.filter((m) => m.label).map((m) => m.label);
        box.innerHTML = `<b>아직 입력하지 않은 항목이 ${labels.length}가지 있습니다.</b> ${labels.map((l) => `<span class="tag bad">${esc(l)}</span>`).join(' ')}<br>
          <span class="sub">빨간 테두리로 표시된 곳을 채운 뒤 다시 [제출]을 눌러 주세요. 지금까지 쓴 것만 저장하려면 [임시 저장]을 누르세요.</span>`;
        box.classList.remove('hidden');
        if (miss[0].el.scrollIntoView) miss[0].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
        return toast(`입력하지 않은 항목이 있습니다: ${labels.slice(0, 3).join(', ')}${labels.length > 3 ? ' 외' : ''}`, true);
      }
    }
    return saveCourse(fd, draft);
  },
  copyTerm: (fd) => run(async () => {
    const n = await api('as_copy_courses', { p_from: +fd.get('from'), p_to: termId, p_shift: +fd.get('shift') || 0 });
    await refresh(); toast(`${n}개 강좌를 복사했습니다. 날짜와 정원을 확인해 주세요.`);
  }),
  letter: (fd) => run(async () => {
    const L = {}; for (const [k, v] of fd.entries()) L[k] = String(v).trim();
    await api('as_save_letter', { p_term: termId, p_letter: L }); await refresh();
  }, '가정통신문 문구를 저장했습니다.'),
  settings: (fd) => run(async () => {
    await api('as_save_term', { p_term: {
      id: termId, title: fd.get('title'), start_date: fd.get('start_date') || null, end_date: fd.get('end_date') || null,
      min_students: fd.get('min_students'), course_open: fd.get('course_open') === 'on', enroll_open: fd.get('enroll_open') === 'on' } });
    await refresh();
  }, '저장되었습니다.'),
  cancelClass: (fd) => {
    const c = courseById(+fd.get('id')), nd = fd.get('new') || null;
    if (!okMakeup(c, nd)) return;
    return run(async () => { await api('as_cancel_class', { p_course: c.id, p_date: fd.get('date'), p_reason: fd.get('reason') || '', p_new: nd }); view.dateSel = nd || fd.get('date'); await refresh(); },
      nd ? '결강 처리하고 보강일을 넣었습니다.' : '결강 처리했습니다. 보강 날짜는 나중에 넣을 수 있습니다.');
  },
  makeup: (fd) => {
    const ch = (S.changes || []).find((x) => x.id === +fd.get('id')), c = courseById(ch.course_id), nd = fd.get('new');
    if (!okMakeup(c, nd)) return;
    return run(async () => { await api('as_set_makeup', { p_change: ch.id, p_new: nd }); view.dateSel = nd; await refresh(); }, '보강 날짜를 저장했습니다.');
  },
  typeDates: (fd) => run(async () => {
    const dates = [...document.querySelectorAll('#dateChips .chip.on')].map((b) => b.dataset.d);
    await api('as_set_type_dates', { p_term: termId, p_type: fd.get('type'), p_dates: dates });
    closeModal(); await refresh();
  }, '수업 날짜를 저장했습니다.'),
  termNew: (fd) => run(async () => {
    const t = { title: fd.get('title'), start_date: fd.get('start_date') || null, end_date: fd.get('end_date') || null };
    await api('as_save_term', { p_term: t });
    yearSel = yearOf(t); try { sessionStorage.setItem('as_year', yearSel); } catch (e) {}
    await refresh();
  }, '새 방과후학교를 만들었습니다.'),
  impStu: (fd) => {
    const rows = [], bad = [];
    parseLines(fd.get('text')).forEach((l) => {
      const p = l.split(/[\t,]/).map((x) => x.trim());
      const [g, c, n] = p.map((x) => parseInt(x, 10));
      if (p.length >= 4 && g > 0 && c > 0 && n > 0 && p[3]) rows.push({ grade: g, class: c, number: n, name: p[3] });
      else if (!/학년/.test(l)) bad.push(l);          // 제목 줄은 조용히 건너뜀
    });
    if (bad.length) return toast(`형식이 맞지 않는 줄이 ${bad.length}개 있습니다. 예: ${bad[0]}`, true);
    if (!rows.length) return toast('등록할 학생이 없습니다.', true);
    return run(async () => { await api('as_import_students', { p_rows: rows }); await refresh(); }, `${rows.length}명을 등록했습니다.`);
  },
  impTea: (fd) => {
    // 엑셀·구글시트에서 여러 칸을 통째로 붙여도 첫 칸(이름)만 사용하고, 제목 줄은 건너뜀
    const rows = parseLines(fd.get('text')).map((l) => l.split(/[\t,]/)[0].trim()).filter((n) => n && n !== '이름').map((name) => ({ name }));
    if (!rows.length) return toast('등록할 교사가 없습니다.', true);
    return run(async () => { await api('as_import_teachers', { p_rows: rows }); await refresh(); }, '교사를 등록했습니다.');
  },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (el && !el.disabled && A[el.dataset.a]) A[el.dataset.a](el);
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-f]');
  if (!f) return;
  e.preventDefault();
  F[f.dataset.f](new FormData(f), e.submitter, f);
});
window.addEventListener('popstate', () => { if (token && S && S.term) A.terms(); });   // 뒤로 가기 → 목록
document.addEventListener('input', (e) => { if (e.target.classList && e.target.classList.contains('miss') && e.target.value.trim()) e.target.classList.remove('miss'); });
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.a === 'enter') A.enter();
});
document.addEventListener('change', (e) => {
  if (e.target.dataset && 'force' in e.target.dataset) {
    const on = e.target.checked;
    return run(async () => { await api('as_set_force_pw', { p_on: on }); await refresh(); }, on ? '비밀번호 변경 강제를 켰습니다.' : '비밀번호 변경 강제를 껐습니다.');
  }
  if (e.target.dataset && e.target.dataset.hr) {
    const [g, c] = e.target.value ? e.target.value.split('-').map(Number) : [null, null];
    return run(async () => { await api('as_set_homeroom', { p_id: +e.target.dataset.hr, p_grade: g, p_class: c }); await refresh(); }, '담임 학급을 저장했습니다.');
  }
  const k = e.target.dataset && e.target.dataset.c;
  if (!k) return;
  if (k === 'formType') {            // 유형을 바꾸면 요일·교시를 그 유형의 기본값으로
    const t = typeOf(e.target.value);
    document.querySelectorAll('#modal [name=days]').forEach((x) => { x.checked = t.days.includes(+x.value); });
    $('#modal [name=period]').value = t.period || '';
    return fillDates(null, t.code);
  }
  if (k === 'formDay') return fillDates(null, $('#modal [name=type_code]').value);
  view[k] = e.target.value;
  if (k === 'addCls') openModal(detailView(courseById(view.detailId))); else render();
});

/* ------------------------------------------------------------------ 시작 */
(async function start() {
  if (cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && window.supabase) {
    sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  }
  if (sb && token) {
    try { await refresh(); return; } catch (e) { setToken(null); S = null; }
  }
  render();
})();
</script>
</body>
</html>
