<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경북여상 방과후학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --ink:#2a2140; --sub:#6f6787; --line:#e4def0; --bg:#f7f4fb; --card:#fff;
          --main:#6a4bc4; --main-d:#4c3399; --pink:#ff6f91; --peach:#ffb199;
          --ok:#1f7a4d; --warn:#b3541e; --bad:#c0303f; --soft:#f0eafc;
          --grad:linear-gradient(120deg,#5a3fc0 0%,#9a4fc7 48%,#ff6f91 100%); }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
         color:var(--ink); background:var(--bg); font-size:15px; line-height:1.55; }
  .disp { font-family:"Jua","Pretendard","Malgun Gothic",sans-serif; font-weight:400; }

  /* ---- 첫 화면 ---- */
  .stage { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
           position:relative; overflow:hidden; color:#fff;
           background:linear-gradient(135deg,#4a34b0 0%,#8a48c4 42%,#f0679a 78%,#ffb08a 100%);
           background-size:180% 180%; animation:drift 16s ease-in-out infinite alternate; }
  @keyframes drift { from { background-position:0% 30%; } to { background-position:100% 70%; } }
  .orb { position:absolute; border-radius:50%; filter:blur(2px); opacity:.35; pointer-events:none;
         background:radial-gradient(circle at 30% 30%,#fff,rgba(255,255,255,0) 70%); animation:float 9s ease-in-out infinite; }
  .orb.o1 { width:340px; height:340px; left:-90px; top:-70px; }
  .orb.o2 { width:240px; height:240px; right:-50px; top:18%; animation-delay:-3s; }
  .orb.o3 { width:420px; height:420px; right:8%; bottom:-190px; animation-delay:-6s; opacity:.25; }
  .orb.o4 { width:150px; height:150px; left:12%; bottom:10%; animation-delay:-4.5s; }
  @keyframes float { 0%,100% { transform:translateY(0) scale(1); } 50% { transform:translateY(-26px) scale(1.05); } }
  .intro { cursor:pointer; text-align:center; user-select:none; }
  .intro .in { position:relative; z-index:1; max-width:1000px; }
  .intro .hello { font-size:clamp(17px,2.6vw,26px); opacity:0; animation:rise .9s .2s ease-out forwards; letter-spacing:.02em; }
  .intro .school { display:inline-block; margin-top:18px; padding:5px 16px; border:1px solid rgba(255,255,255,.6);
           border-radius:30px; font-size:clamp(13px,1.6vw,16px); letter-spacing:.18em; opacity:0; animation:rise .9s .7s ease-out forwards; }
  .intro h1 { margin:18px 0 10px; font-size:clamp(44px,10.5vw,128px); line-height:1.12; text-shadow:0 8px 30px rgba(40,10,80,.35); }
  .intro h1 .w { display:inline-block; white-space:nowrap; margin:0 .12em; }
  .intro h1 .ch { display:inline-block; opacity:0; transform:translateY(.6em) rotate(8deg) scale(.6);
           animation:pop .75s cubic-bezier(.2,1.5,.4,1) forwards, sway 3.2s ease-in-out infinite; }
  @keyframes pop { to { opacity:1; transform:none; } }
  @keyframes sway { 0%,100% { translate:0 0; } 50% { translate:0 -7px; } }
  @keyframes rise { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
  .intro .tag2 { font-size:clamp(15px,2.2vw,22px); opacity:0; animation:rise .9s 2.1s ease-out forwards; }
  .intro .go { margin-top:44px; display:inline-block; padding:13px 34px; border-radius:40px; background:#fff; color:var(--main-d);
           font-weight:700; font-size:17px; box-shadow:0 10px 30px rgba(40,10,80,.3); opacity:0;
           animation:rise .9s 2.6s ease-out forwards, pulse 2s 3.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.06); } }

  /* ---- 로그인 ---- */
  .login { position:relative; z-index:1; width:100%; max-width:420px; background:rgba(255,255,255,.96); color:var(--ink);
           border-radius:22px; padding:30px 28px 26px; box-shadow:0 24px 60px rgba(40,10,80,.35); animation:rise .6s ease-out; }
  .login .mark { width:58px; height:58px; border-radius:18px; background:var(--grad); color:#fff; display:flex;
           align-items:center; justify-content:center; font-size:30px; margin:0 auto 12px; box-shadow:0 8px 18px rgba(106,75,196,.4); }
  .login h2 { text-align:center; font-size:26px; margin:0; color:var(--main-d); }
  .login .lead { text-align:center; color:var(--sub); margin:4px 0 18px; font-size:14px; }
  .login input, .login select { width:100%; padding:11px 12px; border-radius:11px; }
  .login button.pri { width:100%; padding:12px; border-radius:12px; font-size:16px; font-weight:700; margin-top:6px; }
  .login .back { display:block; margin:14px auto 0; border:0; background:none; color:var(--sub); font-size:13px; }
  .seg { display:flex; margin-bottom:8px; background:var(--soft); border-radius:12px; padding:4px; }
  .seg button { flex:1; border:0; background:transparent; border-radius:9px; padding:9px; font-weight:600; color:var(--sub); }
  .seg button.on { background:#fff; color:var(--main-d); box-shadow:0 2px 8px rgba(76,51,153,.18); }

  /* ---- 공통 ---- */
  header.top { background:var(--grad); color:#fff; padding:12px 18px; display:flex; flex-wrap:wrap;
               gap:8px; align-items:center; justify-content:space-between; box-shadow:0 4px 16px rgba(76,51,153,.25); }
  header.top h1 { font-size:21px; margin:0; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
  header.top h1 small { font-family:"Pretendard",sans-serif; font-size:14px; font-weight:500; opacity:.92; }
  header.top .who { font-size:14px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  main { max-width:1080px; margin:0 auto; padding:18px 16px 40px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:14px;
          box-shadow:0 3px 14px rgba(76,51,153,.06); }
  h2 { font-size:18px; margin:0 0 10px; }
  h3 { font-size:15px; margin:18px 0 8px; color:var(--main-d); }
  .sub { color:var(--sub); font-size:13px; }
  button, .btn { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink);
           border-radius:9px; padding:6px 12px; cursor:pointer; transition:.15s; }
  button:hover { border-color:var(--main); }
  button.pri { background:var(--main); border-color:var(--main); color:#fff; }
  button.pri:hover { background:var(--main-d); }
  button.danger { color:var(--bad); }
  button.small { padding:3px 9px; font-size:13px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  header.top button { background:rgba(255,255,255,.16); color:#fff; border-color:rgba(255,255,255,.5); }
  header.top button:hover { background:rgba(255,255,255,.28); border-color:#fff; }
  input, select, textarea { font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:9px;
           background:#fff; color:var(--ink); max-width:100%; }
  input:focus, select:focus, textarea:focus { outline:2px solid rgba(106,75,196,.35); border-color:var(--main); }
  textarea { width:100%; min-height:130px; font-family:ui-monospace,Consolas,monospace; font-size:13px; }
  label { display:block; font-size:13px; color:var(--sub); margin:10px 0 3px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .row > div { flex:1 1 120px; }
  .row input, .row select { width:100%; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .tabs button { border-radius:20px; padding:7px 16px; }
  .tabs button.on { background:var(--main); color:#fff; border-color:var(--main); }
  table { border-collapse:collapse; width:100%; }
  th, td { border-bottom:1px solid var(--line); padding:7px 8px; text-align:left; vertical-align:middle; }
  th { font-size:13px; color:var(--sub); font-weight:600; background:#faf8fe; white-space:nowrap; }
  .scroll { overflow-x:auto; }
  .tag { display:inline-block; font-size:12px; padding:1px 9px; border-radius:10px; background:var(--soft);
         color:var(--main-d); white-space:nowrap; }
  .tag.ok { background:#e3f3ea; color:var(--ok); } .tag.warn { background:#fbeee4; color:var(--warn); }
  .tag.bad { background:#fde8ea; color:var(--bad); }
  .course { display:flex; gap:12px; justify-content:space-between; align-items:center; padding:11px 0;
            border-bottom:1px solid var(--line); }
  .course:last-child { border-bottom:0; }
  .course .t { font-weight:600; }
  .hero { background:var(--grad); color:#fff; border-radius:18px; padding:22px 22px; margin-bottom:16px;
          box-shadow:0 8px 24px rgba(76,51,153,.22); }
  .hero h2 { font-size:24px; margin:0 0 4px; } .hero p { margin:0; opacity:.92; }
  .terms { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px; margin-bottom:16px; }
  .term { text-align:left; background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px 18px 16px;
          box-shadow:0 3px 14px rgba(76,51,153,.07); position:relative; overflow:hidden; }
  .term::before { content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--grad); }
  .term:hover { transform:translateY(-3px); box-shadow:0 10px 26px rgba(76,51,153,.18); border-color:var(--main); }
  .term .tt { font-size:20px; color:var(--main-d); display:block; margin-bottom:4px; }
  .term .go2 { display:block; margin-top:10px; color:var(--pink); font-weight:700; font-size:14px; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; max-height:170px; overflow:auto; padding:6px;
           border:1px solid var(--line); border-radius:9px; }
  .chip { font-size:12px; padding:2px 7px; border-radius:6px; }
  .chip.on { background:var(--main); color:#fff; border-color:var(--main); }
  .chip:not(.on) { text-decoration:line-through; color:var(--sub); }
  #modal { position:fixed; inset:0; background:rgba(42,33,64,.5); display:flex; align-items:flex-start;
           justify-content:center; padding:4vh 12px; overflow:auto; z-index:10; }
  #modal .box { background:#fff; border-radius:18px; padding:20px; width:100%; max-width:760px; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#2a2140; color:#fff;
           padding:10px 18px; border-radius:10px; z-index:20; max-width:90vw; }
  #toast.err { background:var(--bad); }
  .hidden { display:none !important; }
  .right { text-align:right; } .mt { margin-top:12px; } .nowrap { white-space:nowrap; }
  .low { background:#fff7f0; }
  #print { display:none; }
  @media (prefers-reduced-motion: reduce) {
    .stage, .orb, .intro * , .login { animation-duration:.01s !important; animation-iteration-count:1 !important; }
  }
  @media print {
    @page { size:A4 landscape; margin:10mm; }
    body { background:#fff; }
    body > *:not(#print) { display:none !important; }
    #print { display:block; }
    .sheet { page-break-after:always; }
    .sheet:last-child { page-break-after:auto; }
    .sheet h2 { font-size:16pt; text-align:center; margin:0 0 4pt; }
    .sheet p { margin:0 0 6pt; font-size:10pt; text-align:center; }
    .sheet table { font-size:9pt; }
    .sheet th, .sheet td { border:1px solid #333; padding:3pt 2pt; text-align:center; background:#fff; color:#000; }
    .sheet td.nm { white-space:nowrap; }
    .sheet td.cell { min-width:16pt; height:17pt; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="hidden"><div class="box" id="modalBox"></div></div>
<div id="toast" class="hidden"></div>
<div id="print"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
"use strict";
/* ------------------------------------------------------------------ 기본 */
const cfg = window.AS_CONFIG || {};
const DAY = ['', '월', '화', '수', '목', '금', '토', '일'];
const STATUS = { open: '신청 가능', closed: '신청 마감', cancelled: '폐강' };
let sb = null;
let token = null;
try { token = sessionStorage.getItem('as_token'); } catch (e) {}
let termId = null;     // 선택한 방과후학교(운영 단위)
try { termId = +sessionStorage.getItem('as_term') || null; } catch (e) {}
let intro = !token;    // 첫 화면(인사말) 표시 여부
const BRAND = '경북여상 방과후학교';
let S = null;          // 서버 상태
let R = null;          // 교사용 명단
let tab = 'my';
let loginRole = 'student';
let view = { cls: '', listFilter: '', detailId: null, addCls: '' };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const fmt = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const toDate = (s) => new Date(s + 'T00:00:00');
const md = (s) => { const d = toDate(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
const dow = (s) => DAY[toDate(s).getDay() || 7];
const hakbun = (s) => `${s.grade}${pad(s.class)}${pad(s.number)}`;
const typeOf = (code) => S.types.find((t) => t.code === code) || { name: code, days: [], assign_only: false };
const daysText = (t) => t.days.map((d) => DAY[d]).join('·');
const courseById = (id) => S.courses.find((c) => c.id === id);
const isAdmin = () => S && S.me.is_admin;

function toast(msg, err) {
  const t = $('#toast');
  t.textContent = msg; t.className = err ? 'err' : '';
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.add('hidden'), err ? 4500 : 2500);
}
async function rpc(fn, args) {
  const { data, error } = await sb.rpc(fn, args || {});
  if (error) throw new Error(error.message || '요청을 처리하지 못했습니다.');
  return data;
}
const api = (fn, args) => rpc(fn, Object.assign({ p_token: token }, args || {}));

async function run(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    if (/만료/.test(e.message)) { setToken(null); S = null; render(); }
    toast(e.message, true); return false;
  }
}
function setToken(t) {
  token = t;
  try { t ? sessionStorage.setItem('as_token', t) : sessionStorage.removeItem('as_token'); } catch (e) {}
}
function setTerm(id) {
  termId = id || null;
  try { termId ? sessionStorage.setItem('as_term', termId) : sessionStorage.removeItem('as_term'); } catch (e) {}
}
async function refresh() {
  S = await api('as_get_state', { p_term: termId });
  if (termId && !S.term) setTerm(null);
  R = S.me.role === 'teacher' && S.term ? await api('as_get_roster', { p_term: termId }) : null;
  document.title = S.term ? S.term.title : BRAND;
  render();
}
function genDates(start, end, days) {
  const out = [];
  if (!start || !end) return out;
  const d = toDate(start), e = toDate(end);
  while (d <= e) { if (days.includes(d.getDay())) out.push(fmt(d)); d.setDate(d.getDate() + 1); }
  return out;
}
function downloadCsv(name, rows) {
  const text = '﻿' + rows.map((r) => r.map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function openModal(html) { $('#modalBox').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal() { $('#modal').classList.add('hidden'); $('#modalBox').innerHTML = ''; view.detailId = null; }
function doPrint(html) { $('#print').innerHTML = html; window.print(); }

/* ------------------------------------------------------------------ 화면 */
function render() {
  const app = $('#app');
  if (!sb) { app.innerHTML = setupView(); return; }
  if (!token || !S) { app.innerHTML = intro ? introView() : loginView(); return; }
  if (S.me.must_change) { app.innerHTML = headerView() + `<main><div class="card" style="max-width:420px;margin:6vh auto">${pwForm(true)}</div></main>`; return; }
  if (!S.term) { app.innerHTML = headerView() + `<main>${termsView()}</main>`; return; }
  app.innerHTML = headerView() + `<main>${S.me.role === 'student' ? studentView() : teacherView()}</main>`;
  if (view.detailId && courseById(view.detailId)) openModal(detailView(courseById(view.detailId)));
}
function setupView() {
  return `<div class="stage"><div class="login"><h2 class="disp">설정이 필요합니다</h2>
    <p><b>config.js</b> 파일에 Supabase 주소(SUPABASE_URL)와 anon 키(SUPABASE_ANON_KEY)를 입력해 주세요.</p>
    <p class="sub">자세한 방법은 README.md 를 참고하세요.</p></div></div>`;
}
function headerView() {
  const me = S.me;
  const who = me.role === 'student'
    ? `${me.grade}학년 ${me.class}반 ${me.number}번 ${esc(me.name)}`
    : `${esc(me.name)} 선생님${me.is_admin ? ' (관리자)' : ''}`;
  return `<header class="top"><h1 class="disp">${BRAND}${S.term && !me.must_change ? `<small>${esc(S.term.title)}</small>` : ''}</h1>
    <div class="who"><span>${who}</span>
      ${S.term && !me.must_change ? '<button class="small" data-a="terms">방과후학교 목록</button>' : ''}
      ${me.must_change ? '' : '<button class="small" data-a="pwOpen">비밀번호 변경</button>'}
      <button class="small" data-a="logout">로그아웃</button></div></header>`;
}
const ORBS = '<i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><i class="orb o4"></i>';
function introView() {
  let i = 0;
  const word = (w) => `<span class="w">${[...w].map((c) => `<span class="ch" style="animation-delay:${(1.0 + 0.09 * i).toFixed(2)}s, ${(2.2 + 0.13 * i++).toFixed(2)}s">${c}</span>`).join('')}</span>`;
  return `<div class="stage intro" data-a="enter" role="button" tabindex="0" aria-label="${BRAND} 시작하기">${ORBS}
    <div class="in">
      <div class="hello">안녕하세요, 오늘도 반가워요!</div>
      <div><span class="school">경북여자상업고등학교</span></div>
      <h1 class="disp">${word('경북여상')}${word('방과후학교')}</h1>
      <div class="tag2">배우고 싶은 것을 골라, 내일의 나를 준비하는 시간</div>
      <div class="go">화면을 눌러 시작하기 →</div>
    </div></div>`;
}
function loginView() {
  const st = loginRole === 'student';
  return `<div class="stage">${ORBS}<div class="login">
    <div class="mark disp">방</div>
    <h2 class="disp">${BRAND}</h2>
    <p class="lead">${st ? '학년·반·번호와 이름으로 로그인하세요' : '선생님 이름으로 로그인하세요'}</p>
    <div class="seg"><button data-a="role" data-v="student" class="${st ? 'on' : ''}">학생</button>
      <button data-a="role" data-v="teacher" class="${st ? '' : 'on'}">교사</button></div>
    <form data-f="login">
      ${st ? `<div class="row">
          <div><label>학년</label><select name="grade"><option>1</option><option>2</option><option>3</option></select></div>
          <div><label>반</label><input name="class" type="number" min="1" required></div>
          <div><label>번호</label><input name="number" type="number" min="1" required></div></div>` : ''}
      <label>이름</label><input name="name" required autocomplete="off">
      <label>비밀번호</label><input name="pw" type="password" required>
      <p class="sub">처음 로그인할 때 비밀번호는 <b>2026</b> 입니다. 로그인 후 바로 변경하게 됩니다.</p>
      <button class="pri">로그인</button>
    </form>
    <button class="back" data-a="intro">← 첫 화면으로</button></div></div>`;
}
/* 방과후학교(운영 단위) 목록 — 학기·방학마다 하나씩 쌓입니다 */
function termsView() {
  const me = S.me, adm = isAdmin();
  const period = (t) => (t.start_date && t.end_date ? `${t.start_date} ~ ${t.end_date}` : '운영 기간 미정');
  return `<div class="hero"><h2 class="disp">${esc(me.name)}${me.role === 'teacher' ? ' 선생님' : ' 학생'}, 환영합니다!</h2>
      <p>${me.role === 'teacher' ? '운영할 방과후학교를 선택하세요. 지난 방과후학교 기록도 그대로 남아 있습니다.' : '참여할 방과후학교를 선택하세요.'}</p></div>

function periodText() {

}
function capText(c) { return `${c.enrolled}${c.capacity ? ' / ' + c.capacity : ''}명`; }
function courseMeta(c) {
  const t = typeOf(c.type_code);
  return `<span class="tag">${esc(t.name)} ${daysText(t)}</span> ${esc(c.teacher_name)} 선생님 · ${esc(c.room || '강의실 미정')} · ${c.grades.join(',')}학년 · ${capText(c)}`;

/* ---------------------------------------------------------------- 학생 */
function studentView() {
  const me = S.me, open = S.term.enroll_open;
  const mine = new Map(S.my.map((m) => [m.course_id, m]));
  const myCourses = S.courses.filter((c) => mine.has(c.id) && c.status !== 'cancelled');
  const busy = new Set(myCourses.flatMap((c) => typeOf(c.type_code).days));
  const list = S.courses.filter((c) => c.status !== 'cancelled' && c.grades.includes(me.grade));

  const action = (c) => {
    const t = typeOf(c.type_code), m = mine.get(c.id);
    if (m && m.assigned) return '<span class="tag ok">선생님 지정</span>';
    if (m) return open ? `<button class="danger" data-a="cancel" data-id="${c.id}">신청 취소</button>` : '<span class="tag ok">신청 완료</span>';
    if (t.assign_only) return '<span class="tag">교사 지정 강좌</span>';
    if (!open) return '<span class="tag">신청 기간 아님</span>';
    if (c.status !== 'open') return '<span class="tag warn">마감</span>';
    if (c.capacity && c.enrolled >= c.capacity) return '<span class="tag warn">정원 마감</span>';
    if (t.days.some((d) => busy.has(d))) return '<span class="tag">요일 중복</span>';
    return `<button class="pri" data-a="enroll" data-id="${c.id}">신청</button>`;
  };
  const item = (c, withAction) => `<div class="course"><div><div class="t">${esc(c.title)}</div>
      <div class="sub">${courseMeta(c)}</div></div><div class="nowrap">${withAction ? action(c) : ''}</div></div>`;

  let html = `<div class="card"><h2>내 수강 강좌</h2>
    <p class="sub">운영 기간: ${periodText()} · 수강신청: ${open ? '<b>진행 중</b>' : '마감(신청 기간 아님)'}</p>
    ${myCourses.length ? myCourses.map((c) => item(c, true)).join('') : '<p>아직 신청한 강좌가 없습니다.</p>'}</div>`;
  html += `<div class="card"><h2>개설 강좌 (${me.grade}학년)</h2>
    <p class="sub">같은 요일에 열리는 강좌는 하나만 신청할 수 있습니다.</p>`;
  for (const t of S.types) {
    const cs = list.filter((c) => c.type_code === t.code);
    if (!cs.length) continue;
    html += `<h3>${esc(t.name)} (${daysText(t)})${t.assign_only ? ' — 선생님이 수강생을 지정합니다' : ''}</h3>` + cs.map((c) => item(c, true)).join('');
  }
  if (!list.length) html += '<p>개설된 강좌가 없습니다.</p>';
  return html + '</div>';
}

/* ---------------------------------------------------------------- 교사 */
function teacherView() {

}

function allCoursesView() {

          ${c.status !== 'cancelled' ? `<button class="small danger" data-a="status" data-id="${c.id}" data-v="cancelled">폐강</button>` : ''}` : ''}</td></tr>`;

      ${adm ? ' · 정원 조정은 [수정]에서 합니다.' : ''}</p>
    <div class="scroll"><table><thead><tr><th>유형</th><th>강좌명</th><th>교사</th><th>강의실</th><th>학년</th><th>인원</th><th>상태</th><th></th></tr></thead>
    <tbody>${rows || '<tr><td colspan="8">개설된 강좌가 없습니다.</td></tr>'}</tbody></table></div>
    <div class="mt"><button data-a="csvCourses">강좌 현황 CSV 내려받기</button></div></div>`;

function classList() {
  const set = new Map();
  R.students.forEach((s) => set.set(`${s.grade}-${s.class}`, `${s.grade}학년 ${s.class}반`));
  return [...set.entries()];
}
function classOptions(sel, first) {
  return (first ? `<option value="">${first}</option>` : '') +
    classList().map(([k, n]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${n}</option>`).join('');
}
function studentsOf(key) {
  if (!key) return [];
  const [g, c] = key.split('-').map(Number);
  return R.students.filter((s) => s.grade === g && s.class === c);
}
function classTable(key) {
  const byStu = new Map();
  R.enrollments.forEach((e) => {
    const c = courseById(e.course_id);
    if (!c || c.status === 'cancelled') return;
    if (!byStu.has(e.student_id)) byStu.set(e.student_id, {});
    byStu.get(e.student_id)[c.type_code] = c.title;
  });
  const head = ['번호', '이름', ...S.types.map((t) => `${t.name}(${daysText(t)})`)];
  const rows = studentsOf(key).map((s) => {
    const m = byStu.get(s.id) || {};
    return [s.number, s.name, ...S.types.map((t) => m[t.code] || '')];
  });
  return { head, rows };
}
function classView() {
  const list = classList();
  if (!view.cls && list.length) view.cls = list[0][0];
  const { head, rows } = classTable(view.cls);
  const none = rows.filter((r) => r.slice(2).every((v) => !v)).length;
  return `<div class="card"><h2>반별 수강 현황</h2>
    <div class="row"><div style="flex:0 1 200px"><label>학급</label><select data-c="cls">${classOptions(view.cls)}</select></div>
      <div style="flex:0 0 auto"><button data-a="printCls">인쇄</button> <button data-a="csvCls">CSV 내려받기</button></div></div>
    <p class="sub">학생 ${rows.length}명 · 미신청 ${none}명</p>
    <div class="scroll"><table><thead><tr>${head.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r) => `<tr>${r.map((v) => `<td>${esc(v)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${head.length}">등록된 학생이 없습니다.</td></tr>`}</tbody></table></div></div>`;
}

/* 강좌 상세: 수강생 명단 + 학생 지정 + 출석부 */
function rosterOf(courseId) {
  const ids = new Map(R.enrollments.filter((e) => e.course_id === courseId).map((e) => [e.student_id, e]));
  return R.students.filter((s) => ids.has(s.id)).map((s) => Object.assign({ assigned: ids.get(s.id).assigned }, s));
}
function detailView(c) {
  const t = typeOf(c.type_code), mine = isAdmin() || c.teacher_id === S.me.id;

  const cand = studentsOf(view.addCls).filter((s) => c.grades.includes(s.grade));
  return `<div class="row" style="justify-content:space-between"><h2>${esc(c.title)} ${statusTag(c)}</h2>

    <h3>수강생 (${ros.length}명)</h3>

      <td class="right">${mine ? `<button class="small danger" data-a="unassign" data-id="${c.id}" data-s="${s.id}">제외</button>` : ''}</td></tr>`).join('')
      || '<tr><td colspan="4">수강생이 없습니다.</td></tr>'}</tbody></table></div>
    ${mine && c.status !== 'cancelled' ? `<h3>학생 지정${t.assign_only ? '' : ' (필요한 경우에만)'}</h3>
      <div style="max-width:220px"><select data-c="addCls">${classOptions(view.addCls, '학급 선택')}</select></div>
      <div class="mt">${cand.map((s) => `<button class="small" style="margin:2px" data-a="assign" data-id="${c.id}" data-s="${s.id}" ${inSet.has(s.id) ? 'disabled' : ''}>${s.number}. ${esc(s.name)}${inSet.has(s.id) ? ' ✓' : ''}</button>`).join('')
        || (view.addCls ? '<span class="sub">수강 대상 학년의 학생이 없습니다.</span>' : '<span class="sub">학급을 고르면 학생 이름이 나옵니다. 이름을 누르면 수강생으로 지정됩니다.</span>')}</div>` : ''}`;
}
function attendanceHtml(c) {
  const t = typeOf(c.type_code), ros = rosterOf(c.id), PER = 20;
  const chunks = [];
  for (let i = 0; i < Math.max(c.dates.length, 1); i += PER) chunks.push(c.dates.slice(i, i + PER));
  return chunks.map((ds, i) => {
    const cols = ds.length ? ds : Array(PER).fill(null);
    return `<section class="sheet"><h2>${esc(c.title)} 출석부</h2>
      <p>${esc(S.term.title)} · ${esc(t.name)}(${daysText(t)}) · 담당 ${esc(c.teacher_name)} · ${esc(c.room)} · ${periodText()} · ${i + 1}/${chunks.length}쪽</p>
      <table><thead><tr><th>연번</th><th>학번</th><th>이름</th>${cols.map((d) => `<th>${d ? md(d) + '<br>' + dow(d) : '&nbsp;'}</th>`).join('')}</tr></thead>
      <tbody>${ros.map((s, k) => `<tr><td>${k + 1}</td><td>${hakbun(s)}</td><td class="nm">${esc(s.name)}</td>${cols.map(() => '<td class="cell"></td>').join('')}</tr>`).join('')}
      ${[1, 2].map(() => `<tr><td>&nbsp;</td><td></td><td></td>${cols.map(() => '<td class="cell"></td>').join('')}</tr>`).join('')}</tbody></table></section>`;
  }).join('');
}

function fillDates(dates, typeCode) {

      ${studs.map((s) => `<tr><td>${hakbun(s)}</td><td>${esc(s.name)}</td><td class="right nowrap">
        <button class="small" data-a="pwReset" data-r="student" data-id="${s.id}" data-n="${esc(s.name)}">비밀번호 초기화</button>
        <button class="small danger" data-a="stuDel" data-id="${s.id}" data-n="${esc(s.name)}">삭제</button></td></tr>`).join('')}</tbody></table></div>` : ''}
    </div>
    <div class="card"><h2>교사 명단</h2>
    <p class="sub">한 줄에 한 명씩 이름을 입력하세요. 동명이인은 '김민수A', '김민수B'처럼 구분해 주세요. 초기 비밀번호는 2026 입니다.</p>
    <form data-f="impTea"><textarea name="text" style="min-height:80px" placeholder="김교사&#10;이교사"></textarea>
      <div class="mt"><button class="pri">교사 등록</button></div></form>
    <div class="scroll mt"><table><thead><tr><th>이름</th><th>권한</th><th></th></tr></thead><tbody>
      ${S.teachers.map((t) => `<tr><td>${esc(t.name)}</td><td>${t.is_admin ? '<span class="tag">관리자</span>' : '교사'}</td><td class="right nowrap">
        <button class="small" data-a="admin" data-id="${t.id}" data-v="${t.is_admin ? 0 : 1}">${t.is_admin ? '관리자 해제' : '관리자 지정'}</button>
        <button class="small" data-a="pwReset" data-r="teacher" data-id="${t.id}" data-n="${esc(t.name)}">비밀번호 초기화</button>
        <button class="small danger" data-a="teaDel" data-id="${t.id}" data-n="${esc(t.name)}">삭제</button></td></tr>`).join('')}</tbody></table></div></div>`;
}
function settingsView() {
  const s = S.term;
  return `<div class="card"><h2>일정·설정</h2>
    <form data-f="settings">
      <label>방과후학교 이름</label><input name="title" value="${esc(s.title)}" style="width:100%;max-width:420px">
      <div class="row" style="max-width:420px"><div><label>시작일</label><input name="start_date" type="date" value="${s.start_date || ''}"></div>
        <div><label>종료일</label><input name="end_date" type="date" value="${s.end_date || ''}"></div></div>
      <label>폐강 검토 기준 인원 (이 인원 미만이면 '인원 미달' 표시)</label>
      <input name="min_students" type="number" min="0" value="${s.min_students}" style="width:120px">
      <p><label style="display:inline;color:inherit;font-size:15px"><input type="checkbox" name="course_open" ${s.course_open ? 'checked' : ''}> 교사 강좌 개설·수정 허용</label></p>
      <p><label style="display:inline;color:inherit;font-size:15px"><input type="checkbox" name="enroll_open" ${s.enroll_open ? 'checked' : ''}> 학생 수강신청 열기</label></p>
      <button class="pri">저장</button>
      <button type="button" class="danger" data-a="termDel" style="float:right">이 방과후학교 삭제</button>
    </form>
    <h3>강좌 유형</h3>
    <table style="max-width:420px"><thead><tr><th>유형</th><th>요일</th><th>신청 방식</th></tr></thead><tbody>
      ${S.types.map((t) => `<tr><td>${esc(t.name)}</td><td>${daysText(t)}</td><td>${t.assign_only ? '교사 지정' : '학생 신청'}</td></tr>`).join('')}</tbody></table>
    <p class="sub">운영 순서: ① 기간 입력 → ② 교사 강좌 개설 → ③ 기초반 학생 지정 → ④ 수강신청 열기 → ⑤ 신청 닫고 [전체 강좌]에서 정원·폐강 조정 → ⑥ 출석부 인쇄</p></div>`;
}

/* ------------------------------------------------------------------ 동작 */
const parseLines = (text) => text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);

const A = {
  role: (el) => { loginRole = el.dataset.v; render(); },
  tab: (el) => { tab = el.dataset.v; render(); },
  close: () => closeModal(),
  enter: () => { intro = false; render(); },
  intro: () => { intro = true; render(); },
  term: (el) => run(async () => { setTerm(+el.dataset.id); tab = 'my'; view = { cls: '', listFilter: '', detailId: null, addCls: '' }; await refresh(); window.scrollTo(0, 0); }),
  terms: () => run(async () => { setTerm(null); closeModal(); await refresh(); }),
  termDel: () => { if (confirm(`'${S.term.title}'을(를) 삭제할까요?\n강좌가 하나도 없을 때만 삭제됩니다.`)) run(async () => { await api('as_delete_term', { p_id: termId }); setTerm(null); await refresh(); }, '삭제되었습니다.'); },
  logout: async () => { try { await api('as_logout'); } catch (e) {} setToken(null); setTerm(null); S = R = null; intro = false; closeModal(); render(); },
  pwOpen: () => openModal(pwForm(false)),
  enroll: (el) => run(async () => { await api('as_enroll', { p_course: +el.dataset.id }); await refresh(); }, '신청되었습니다.'),
  cancel: (el) => { if (confirm('신청을 취소할까요?')) run(async () => { await api('as_cancel_enroll', { p_course: +el.dataset.id }); await refresh(); }, '취소되었습니다.'); },
  courseNew: () => { openModal(courseForm(null)); fillDates(null, S.types[0].code); },
  courseEdit: (el) => { const c = courseById(+el.dataset.id); openModal(courseForm(c)); fillDates(c.dates, c.type_code); },
  courseDel: (el) => { if (confirm('이 강좌를 삭제할까요?')) run(async () => { await api('as_delete_course', { p_course: +el.dataset.id }); await refresh(); }, '삭제되었습니다.'); },
  chip: (el) => { el.classList.toggle('on'); countDates(); },
  datesReset: () => fillDates(null, $('[name=type_code]').value),
  detail: (el) => { view.detailId = +el.dataset.id; view.addCls = ''; openModal(detailView(courseById(view.detailId))); },
  assign: (el) => run(async () => { await api('as_assign', { p_course: +el.dataset.id, p_student: +el.dataset.s }); await refresh(); }, '지정되었습니다.'),
  unassign: (el) => { if (confirm('이 학생을 수강생에서 제외할까요?')) run(async () => { await api('as_unassign', { p_course: +el.dataset.id, p_student: +el.dataset.s }); await refresh(); }, '제외되었습니다.'); },
  status: (el) => {
    const c = courseById(+el.dataset.id), v = el.dataset.v;
    if (v === 'cancelled' && !confirm(`'${c.title}' 강좌를 폐강할까요?\n수강생 ${c.enrolled}명의 신청 내역이 삭제되며 되돌릴 수 없습니다.`)) return;
    run(async () => { await api('as_set_course_status', { p_course: c.id, p_status: v }); await refresh(); }, '변경되었습니다.');
  },
  printAtt: (el) => doPrint(attendanceHtml(courseById(+el.dataset.id))),
  csvRoster: (el) => {
    const c = courseById(+el.dataset.id);
    downloadCsv(`${c.title}_명단.csv`, [['학번', '학년', '반', '번호', '이름', '구분'],
      ...rosterOf(c.id).map((s) => [hakbun(s), s.grade, s.class, s.number, s.name, s.assigned ? '교사 지정' : '학생 신청'])]);
  },
  csvCourses: () => downloadCsv('강좌현황.csv', [['유형', '요일', '강좌명', '교사', '강의실', '학년', '인원', '정원', '상태'],
    ...S.courses.map((c) => { const t = typeOf(c.type_code); return [t.name, daysText(t), c.title, c.teacher_name, c.room, c.grades.join(' '), c.enrolled, c.capacity ?? '', STATUS[c.status]]; })]),
  csvCls: () => { const { head, rows } = classTable(view.cls); downloadCsv(`${view.cls}반_수강현황.csv`, [head, ...rows]); },
  printCls: () => {
    const { head, rows } = classTable(view.cls), [g, c] = view.cls.split('-');
    doPrint(`<section class="sheet"><h2>${g}학년 ${c}반 방과후학교 수강 현황</h2><p>${esc(S.term.title)} · ${periodText()}</p>
      <table><thead><tr>${head.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${rows.map((r) => `<tr>${r.map((v) => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></section>`);
  },
  pwReset: (el) => { if (confirm(`${el.dataset.n}의 비밀번호를 2026으로 초기화할까요?`)) run(() => api('as_reset_password', { p_role: el.dataset.r, p_id: +el.dataset.id }), '초기화되었습니다.'); },
  stuDel: (el) => { if (confirm(`${el.dataset.n} 학생을 삭제할까요? 수강 내역도 함께 삭제됩니다.`)) run(async () => { await api('as_delete_student', { p_id: +el.dataset.id }); await refresh(); }, '삭제되었습니다.'); },
  teaDel: (el) => { if (confirm(`${el.dataset.n} 선생님 계정을 삭제할까요?`)) run(async () => { await api('as_delete_teacher', { p_id: +el.dataset.id }); await refresh(); }, '삭제되었습니다.'); },
  admin: (el) => run(async () => { await api('as_set_admin', { p_id: +el.dataset.id, p_admin: el.dataset.v === '1' }); await refresh(); }, '변경되었습니다.'),
};

const F = {
  login: (fd) => run(async () => {
    const r = loginRole === 'student'
      ? await rpc('as_login_student', { p_grade: +fd.get('grade'), p_class: +fd.get('class'), p_number: +fd.get('number'), p_name: fd.get('name'), p_pw: fd.get('pw') })
      : await rpc('as_login_teacher', { p_name: fd.get('name'), p_pw: fd.get('pw') });
    setToken(r.token); tab = 'my'; await refresh();
  }),
  pw: (fd) => {
    if (fd.get('n1') !== fd.get('n2')) return toast('새 비밀번호가 서로 다릅니다.', true);
    return run(async () => { await api('as_change_password', { p_old: fd.get('old'), p_new: fd.get('n1') }); closeModal(); await refresh(); }, '비밀번호가 변경되었습니다.');
  },
  course: (fd) => run(async () => {
    const dates = [...document.querySelectorAll('#dateChips .chip.on')].map((b) => b.dataset.d);
    await api('as_save_course', { p_course: {
      id: fd.get('id') || null, term_id: termId, type_code: fd.get('type_code'), title: fd.get('title'), room: fd.get('room') || '',
      capacity: fd.get('capacity') || null, teacher_id: fd.get('teacher_id') || null,
      grades: fd.getAll('grades').map(Number), dates } });
    closeModal(); await refresh();
  }, '저장되었습니다.'),
  settings: (fd) => run(async () => {
    await api('as_save_term', { p_term: {
      id: termId, title: fd.get('title'), start_date: fd.get('start_date') || null, end_date: fd.get('end_date') || null,
      min_students: fd.get('min_students'), course_open: fd.get('course_open') === 'on', enroll_open: fd.get('enroll_open') === 'on' } });
    await refresh();
  }, '저장되었습니다.'),
  termNew: (fd) => run(async () => {
    await api('as_save_term', { p_term: { title: fd.get('title'), start_date: fd.get('start_date') || null, end_date: fd.get('end_date') || null } });
    await refresh();
  }, '새 방과후학교를 만들었습니다.'),
  impStu: (fd) => {
    const rows = [], bad = [];
    parseLines(fd.get('text')).forEach((l) => {
      const p = l.split(/[\t,]/).map((x) => x.trim());
      const [g, c, n] = p.map((x) => parseInt(x, 10));
      if (p.length >= 4 && g > 0 && c > 0 && n > 0 && p[3]) rows.push({ grade: g, class: c, number: n, name: p[3] });
      else if (!/학년/.test(l)) bad.push(l);          // 제목 줄은 조용히 건너뜀
    });
    if (bad.length) return toast(`형식이 맞지 않는 줄이 ${bad.length}개 있습니다. 예: ${bad[0]}`, true);
    if (!rows.length) return toast('등록할 학생이 없습니다.', true);
    return run(async () => { await api('as_import_students', { p_rows: rows }); await refresh(); }, `${rows.length}명을 등록했습니다.`);
  },
  impTea: (fd) => {
    const rows = parseLines(fd.get('text')).map((name) => ({ name }));
    if (!rows.length) return toast('등록할 교사가 없습니다.', true);
    return run(async () => { await api('as_import_teachers', { p_rows: rows }); await refresh(); }, '교사를 등록했습니다.');
  },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (el && !el.disabled && A[el.dataset.a]) A[el.dataset.a](el);
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-f]');
  if (!f) return;
  e.preventDefault();
  F[f.dataset.f](new FormData(f));
});
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.a === 'enter') A.enter();
});
document.addEventListener('change', (e) => {
  const k = e.target.dataset && e.target.dataset.c;
  if (!k) return;
  if (k === 'formType') return fillDates(null, e.target.value);
  view[k] = e.target.value;
  if (k === 'addCls') openModal(detailView(courseById(view.detailId))); else render();
});

/* ------------------------------------------------------------------ 시작 */
(async function start() {
  if (cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && window.supabase) {
    sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  }
  if (sb && token) {
    try { await refresh(); return; } catch (e) { setToken(null); S = null; }
  }
  render();
})();
</script>
</body>
</html>
